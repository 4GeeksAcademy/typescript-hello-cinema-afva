
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema Seat Manager</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen p-6">

    <main class="max-w-3xl mx-auto bg-white rounded-xl shadow-lg p-6">

        <h1 class="text-3xl font-bold text-center mb-2">
            Cinema Seat Manager
        </h1>

        <p class="text-center text-gray-500 mb-8">
            Select a seat to make a reservation
        </p>

        <div class="bg-slate-800 text-white text-center py-3 rounded mb-8">
            SCREEN
        </div>

        <div id="cinema" class="flex flex-col items-center gap-2 mb-6"></div>

        <div class="flex justify-center gap-6 mb-8 text-sm">
            <span>🟩 Available</span>
            <span>🟥 Occupied</span>
        </div>

        <div class="grid grid-cols-3 gap-4 text-center mb-6">
            <div class="bg-green-100 p-4 rounded">
                <p class="text-sm">Available</p>
                <p id="available" class="text-2xl font-bold">80</p>
            </div>

            <div class="bg-red-100 p-4 rounded">
                <p class="text-sm">Occupied</p>
                <p id="occupied" class="text-2xl font-bold">0</p>
            </div>

            <div class="bg-slate-100 p-4 rounded">
                <p class="text-sm">Total</p>
                <p id="total" class="text-2xl font-bold">80</p>
            </div>
        </div>

        <p id="message" role="status" aria-live="polite"
           class="text-center text-gray-700 mb-6">
            Click an available seat to reserve it.
        </p>

        <div class="text-center">
            <button id="reset"
                class="bg-slate-800 text-white px-6 py-3 rounded hover:bg-slate-700">
                Reset Cinema
            </button>
        </div>

    </main>

    <script type="module" src="/src/web.ts"></script>
</body>
</html>
